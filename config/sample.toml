version = 1

[custom]
# 启用规则生成器，必须为 true 才能接管规则
enable_rule_generator = true
# 覆盖原有规则，必须为 true
overwrite_original_rules = true
# 输出重命名：这里不需要，保持默认即可
rename_node = ""

# 基础配置：如果你生成的是 Clash 格式，Subconverter 会使用默认的 base 文件
# 你也可以指定 clash_rule_base = "你的base文件地址" 来完全控制 DNS 等设置

[[custom_groups]]
name = "⚪ 节点选择"
type = "select"
icon = "https://dl-cdn.sxczbbs.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png"
# 对应 proxies: [🟡 顺序, 🟢 自动, 🗿 香港 负载均衡, 💀 美日 故障转移] 以及所有节点
member = ["🟡 顺序", "🟢 自动", "🗿 香港 负载均衡", "💀 美日 故障转移", ".*"]

[[custom_groups]]
name = "🍻 哔哩"
type = "select"
icon = "https://dl-cdn.sxczbbs.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili.png"
# 对应 filter: "HK" 和 proxies: [DIRECT]
member = ["DIRECT", "(?i)HK|Hong"]

[[custom_groups]]
name = "✈️ 电报"
type = "select"
icon = "https://dl-cdn.sxczbbs.com/https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png"
member = ["⚪ 节点选择", "🟢 自动", "🗿 香港 负载均衡"]

[[custom_groups]]
name = "🪟 微软"
type = "select"
icon = "https://dl-cdn.sxczbbs.com/https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/microsoft.png"
member = ["⚪ 节点选择", "DIRECT"]

[[custom_groups]]
name = "⛳ 谷歌"
type = "select"
icon = "https://dl-cdn.sxczbbs.com/https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/google(1).png"
member = ["⚪ 节点选择", "🗿 香港 负载均衡", "💀 美日 故障转移", "DIRECT"]

[[custom_groups]]
name = "🍏 苹果"
type = "select"
icon = "https://dl-cdn.sxczbbs.com/https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/apple.png"
member = ["DIRECT", "🗿 香港 负载均衡", "⚪ 节点选择"]

[[custom_groups]]
name = "🐼 Ehentai"
type = "select"
member = ["⚪ 节点选择"]

[[custom_groups]]
name = "🕹️ EPIC"
type = "select"
member = ["DIRECT", "⚪ 节点选择"]

[[custom_groups]]
name = "☁️ STEAM"
type = "select"
member = ["DIRECT", "⚪ 节点选择"]

[[custom_groups]]
name = "🍉 大陆"
type = "select"
member = ["DIRECT", "REJECT"]

[[custom_groups]]
name = "🔵 其他"
type = "select"
member = ["⚪ 节点选择", "DIRECT"]

[[custom_groups]]
name = "⛔️ 广告"
type = "select"
member = ["REJECT", "DIRECT", "⚪ 节点选择"]

[[custom_groups]]
name = "🎶 抖音"
type = "select"
member = ["REJECT", "DIRECT", "⚪ 节点选择"]

[[custom_groups]]
name = "🍚 米哈游"
type = "select"
member = ["DIRECT", "⚪ 节点选择"]

[[custom_groups]]
name = "🖼️ Adobe"
type = "select"
member = ["REJECT", "⚪ 节点选择", "DIRECT"]

[[custom_groups]]
name = "⚧️ 被墙"
type = "select"
member = ["⚪ 节点选择", "DIRECT"]

[[custom_groups]]
name = "💴 银行支付"
type = "select"
member = ["DIRECT", "⚪ 节点选择"]

[[custom_groups]]
name = "🗻 微软开发隧道"
type = "select"
member = ["🟢 自动", "🟡 顺序", "⚪ 节点选择"]

# 策略组：香港 负载均衡
[[custom_groups]]
name = "🗿 香港 负载均衡"
type = "load-balance"
strategy = "consistent-hashing"
url = "https://www.gstatic.com/generate_204"
interval = 300
# 对应 filter: "HK"
member = ["(?i)HK|Hong"]

# 策略组：美日 故障转移
[[custom_groups]]
name = "💀 美日 故障转移"
type = "fallback"
url = "https://www.gstatic.com/generate_204"
interval = 300
# 对应 filter: "LAX|ITM|🇺🇸|🇯🇵", exclude-filter: "中转"
member = ["(LAX|ITM|🇺🇸|🇯🇵|US|JP)"]
# Subconverter 的 exclude 逻辑通常在 member 正则中处理，或者依赖 rename 移除
# 这里简单实现正则包含。

# 策略组：顺序
[[custom_groups]]
name = "🟡 顺序"
type = "fallback"
url = "https://www.gstatic.com/generate_204"
interval = 300
member = [".*"]

# 策略组：自动
[[custom_groups]]
name = "🟢 自动"
type = "url-test"
url = "https://www.gstatic.com/generate_204"
interval = 300
member = [".*"]

# ==============================================
# 规则集配置 (Rulesets)
# 顺序非常重要，Subconverter 从上到下匹配
# ==============================================

# 1. 广告规则 (Anti-AD) & 进程规则
[[rulesets]]
group = "⛔️ 广告"
ruleset = "https://dl-cdn.sxczbbs.com/https://raw.githubusercontent.com/privacy-protection-tools/anti-AD/master/anti-ad-clash.yaml"

[[rulesets]]
group = "⛔️ 广告"
ruleset = [
  "PROCESS-NAME,Lightroom.exe",
  "PROCESS-NAME,Photoshop.exe"
]

# 2. Adobe 相关 (混合了 Domain Suffix 和 远程规则)
[[rulesets]]
group = "🖼️ Adobe"
ruleset = [
  "DOMAIN-SUFFIX,adobe.io",
  "DOMAIN-SUFFIX,photo-api.adobe.io"
]

[[rulesets]]
group = "🖼️ Adobe"
