[custom]
; Based on Mihomo config 25/11/23
; Generated for Subconverter

; ----------------------------------------------------------------------
; 策略组配置 (Proxy Groups)
; 语法: custom_proxy_group=组名`类型`筛选正则`包含的其他组或节点
; ----------------------------------------------------------------------

; 1. 主要选择组 (Select)
; ⚪ 节点选择 - 包含上述策略组及所有节点
custom_proxy_group=⚪ 节点选择`select`[]🟡 顺序`[]🟢 自动`[]🗿 香港 负载均衡`[]💀 美日 故障转移`.*


; 3. 业务策略组
; 🍻 哔哩 - 筛选 HK
custom_proxy_group=🍻 哔哩`select`HK`[]DIRECT`[]⚪ 节点选择

; ✈️ 电报
custom_proxy_group=✈️ 电报`select`[]⚪ 节点选择`[]🟢 自动`[]🗿 香港 负载均衡`.*

; 🪟 微软
custom_proxy_group=🪟 微软`select`[]⚪ 节点选择`[]DIRECT`.*

; ⛳ 谷歌
custom_proxy_group=⛳ 谷歌`select`[]⚪ 节点选择`[]🗿 香港 负载均衡`[]💀 美日 故障转移`[]DIRECT`.*

; 🍏 苹果
custom_proxy_group=🍏 苹果`select`[]DIRECT`[]🗿 香港 负载均衡`[]⚪ 节点选择`.*

; 🐼 Ehentai
custom_proxy_group=🐼 Ehentai`select`[]⚪ 节点选择`.*

; 🕹️ EPIC
custom_proxy_group=🕹️ EPIC`select`[]DIRECT`[]⚪ 节点选择`.*

; ☁️ STEAM
custom_proxy_group=☁️ STEAM`select`[]DIRECT`[]⚪ 节点选择`.*

; 🍉 大陆
custom_proxy_group=🍉 大陆`select`[]DIRECT`[]REJECT

; 🔵 其他
custom_proxy_group=🔵 其他`select`[]⚪ 节点选择`[]DIRECT

; ⛔️ 广告
custom_proxy_group=⛔️ 广告`select`[]REJECT`[]DIRECT`[]⚪ 节点选择

; 🎶 抖音
custom_proxy_group=🎶 抖音`select`[]REJECT`[]DIRECT`[]⚪ 节点选择

; 🍚 米哈游
custom_proxy_group=🍚 米哈游`select`[]DIRECT`[]⚪ 节点选择

; 🖼️ Adobe
custom_proxy_group=🖼️ Adobe`select`[]REJECT`[]⚪ 节点选择`[]DIRECT

; ⚧️ 被墙
custom_proxy_group=⚧️ 被墙`select`[]⚪ 节点选择`[]DIRECT

; 💴 银行支付
custom_proxy_group=💴 银行支付`select`[]DIRECT`[]⚪ 节点选择`.*

; 🗻 微软开发隧道
custom_proxy_group=🗻 微软开发隧道`select`[]🟢 自动`[]🟡 顺序`[]⚪ 节点选择`.*

; 5. 基础策略组 (Url-Test / Fallback / Load-Balance)
; 🟢 自动 (Url-Test) - 对应原配置 provider1 全选
custom_proxy_group=🟢 自动`url-test`.*`http://www.gstatic.com/generate_204`300

; 🟡 顺序 (Fallback) - 对应原配置 provider1 全选
custom_proxy_group=🟡 顺序`fallback`.*`http://www.gstatic.com/generate_204`300

; 🗿 香港 负载均衡 (Load-Balance) - 筛选 HK
custom_proxy_group=🗿 香港 负载均衡`load-balance`HK`http://www.gstatic.com/generate_204`300

; 💀 美日 故障转移 (Fallback) - 筛选 LAX|ITM|🇺🇸|🇯🇵，排除 "中转"
; 使用正则预查排除中转
custom_proxy_group=💀 美日 故障转移`fallback`^(?=.*(LAX|ITM|🇺🇸|🇯🇵))(?!.*中转).*$`http://www.gstatic.com/generate_204`300
; ----------------------------------------------------------------------
; 规则集配置 (Rulesets)
; 语法: ruleset=目标策略组,规则文件URL 或 ruleset=目标策略组,[]规则类型,参数
; 注意：Subconverter 会严格按照这里的顺序生成规则，顺序非常重要
; ----------------------------------------------------------------------

enable_rule_generator=true
overwrite_original_rules=true

; 1. 广告拦截 (Anti-AD & Inline Process Rules)
ruleset=⛔️ 广告,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=⛔️ 广告,[]PROCESS-NAME,Lightroom.exe
ruleset=⛔️ 广告,[]PROCESS-NAME,Photoshop.exe

; 2. Adobe (Inline Domains & Remote Rule)
ruleset=🖼️ Adobe,[]DOMAIN-SUFFIX,adobe.io
ruleset=🖼️ Adobe,[]DOMAIN-SUFFIX,photo-api.adobe.io
ruleset=🖼️ Adobe,clash-domain:https://raw.githubusercontent.com/qljsyph/ruleset-icon/main/mihomo/domain/Adobe2.yaml

; 3. 银行支付 (HK Bank & Paypal)
ruleset=💴 银行支付,https://raw.githubusercontent.com/EliDoves/Proxy/master/Surge/Rule/Bank/Bank_HK.list
ruleset=💴 银行支付,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/paypal.yaml

; 4. 微软开发隧道 (Inline Rules)
ruleset=🗻 微软开发隧道,[]DOMAIN-SUFFIX,rel.tunnels.api.visualstudio.com
ruleset=🗻 微软开发隧道,[]DOMAIN-SUFFIX,devtunnels.ms

; 5. 抖音 (Douyin)
ruleset=🎶 抖音,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/DouYin/DouYin.list

; 6. 米哈游 (HoYoverse Domain & IP)
ruleset=🍚 米哈游,https://raw.githubusercontent.com/LM-Firefly/Rules/master/Game/HoYoverse.list
ruleset=🍚 米哈游,clash-ipcidr:https://raw.githubusercontent.com/Yubainc/clash-rules/main/category-games@as-ipcidr.yaml

; 7. 直连修正 (Inline Rules)
ruleset=DIRECT,[]DOMAIN,clash.razord.top
ruleset=DIRECT,[]DOMAIN,yacd.haishan.me

; 8. 微软 (Microsoft)
ruleset=🪟 微软,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.yaml

; 9. 电报 (Telegram Domain & IP)
ruleset=✈️ 电报,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.yaml
ruleset=✈️ 电报,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.yaml

; 10. 哔哩哔哩 (Bilibili Domain & IP)
ruleset=🍻 哔哩,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/bilibili.yaml
ruleset=🍻 哔哩,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geoip/bilibili.yaml

; 11. 苹果 (Apple Domain & IP)
ruleset=🍏 苹果,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.yaml
ruleset=🍏 苹果,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geoip/apple.yaml

; 12. Ehentai
ruleset=🐼 Ehentai,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/ehentai.yaml

; 13. Epic Games (Rule & Process)
ruleset=🕹️ EPIC,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/epicgames.yaml
ruleset=🕹️ EPIC,[]PROCESS-NAME,EpicGamesLauncher.exe

; 14. Steam CN
ruleset=☁️ STEAM,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam@cn.yaml

; 15. Google
ruleset=⛳ 谷歌,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.yaml

; 16. GFW (被墙)
ruleset=⚧️ 被墙,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.yaml

; 17. 大陆 (Geo Domain / Geo IP)
ruleset=🍉 大陆,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🍉 大陆,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🍉 大陆,[]GEOIP,CN

; 18. 其他非CN流量 (Geo Not CN)
; ruleset=🔵 其他,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.yaml

; 19. 兜底规则 (Match)
; Subconverter 会自动将未匹配的流量指向 Final 组，或者通过下行指定
ruleset=🔵 其他,[]MATCH